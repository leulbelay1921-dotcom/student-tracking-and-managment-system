services:
  postgres:
    image: postgres:16-alpine
    container_name: sitms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sitms}
      POSTGRES_USER: ${POSTGRES_USER:-sitms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sitms} -d ${POSTGRES_DB:-sitms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: sitms-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sitms}
      KC_DB_USERNAME: ${POSTGRES_USER:-sitms}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-sitms}
      KC_HTTP_PORT: 8080
      KC_THEME: sitms-theme
    volumes:
      - ../docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ../docker/keycloak/themes:/opt/keycloak/themes
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        m2: ${M2_PATH:-C:\Users\HP\.m2}
    image: sitms-backend:latest
    container_name: sitms-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sitms}
      DB_USERNAME: ${POSTGRES_USER:-sitms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sitms}
      OIDC_ISSUER_URI: http://localhost:8081/realms/sitms
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-sitms-webapp}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/sitms/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      SERVER_PORT: ${SERVER_PORT:-8080}
      JPA_DDL_AUTO: validate
      FLYWAY_ENABLED: "true"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    expose:
      - "8080"
    ports:
      - "8083:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      additional_contexts:
        npmcache: ${NPM_CACHE_PATH:-C:\Users\HP\AppData\Local\npm-cache}
    image: sitms-frontend:latest
    container_name: sitms-frontend
    depends_on:
      - backend
    ports:
      - "4201:80"

volumes:
  pgdata: